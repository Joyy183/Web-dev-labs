<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendly Greetings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="greeting-card">
    <h1 id="message">Welcome!</h1>
    <p class="hint">Enter a name to add it to your greeting list.</p>
    <div class="name-form">
      <input id="personName" type="text" placeholder="Enter a name" aria-label="Name">
      <button id="addButton" type="button">Say Hello</button>
    </div>
    <ul id="namesList"></ul>
    <p class="tip">Click a name to say goodbye.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
